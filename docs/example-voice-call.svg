<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 430" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1560" height="430" fill="#ffffff"/>
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/></marker></defs>
<text x="780.0" y="34" font-size="21" font-weight="800" fill="#0f172a" text-anchor="middle">Voice: having a spoken conversation</text>
<text x="780.0" y="56" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">Real example — asking your balance, then switching to Telugu</text>
<line x1="330" y1="235.0" x2="350" y2="235.0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="60" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="60" y="110" width="268" height="250" rx="12" fill="#ede9fe" opacity="0.5"/>
<circle cx="194.0" cy="144" r="21" fill="#7c3aed"/>
<text x="194.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="194.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">You just talk</text>
<text x="194.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">Click "Start voice"</text>
<text x="194.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">— no typing,</text>
<text x="194.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">speak naturally</text>
<line x1="622" y1="235.0" x2="642" y2="235.0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="352" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="352" y="110" width="268" height="250" rx="12" fill="#ede9fe" opacity="0.5"/>
<circle cx="486.0" cy="144" r="21" fill="#7c3aed"/>
<text x="486.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="486.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">AI listens live</text>
<text x="486.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">Understands your</text>
<text x="486.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">speech directly,</text>
<text x="486.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">no typing needed</text>
<line x1="914" y1="235.0" x2="934" y2="235.0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="644" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="644" y="110" width="268" height="250" rx="12" fill="#ede9fe" opacity="0.5"/>
<circle cx="778.0" cy="144" r="21" fill="#7c3aed"/>
<text x="778.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="778.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Quiet lookup</text>
<text x="778.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">If needed, fetches</text>
<text x="778.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">your real account</text>
<text x="778.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">data behind the scenes</text>
<line x1="1206" y1="235.0" x2="1226" y2="235.0" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="936" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="936" y="110" width="268" height="250" rx="12" fill="#ede9fe" opacity="0.5"/>
<circle cx="1070.0" cy="144" r="21" fill="#7c3aed"/>
<text x="1070.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="1070.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Spoken answer</text>
<text x="1070.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">Replies out loud,</text>
<text x="1070.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">in your language,</text>
<text x="1070.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">with your real numbers</text>
<rect x="1228" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="1.8"/>
<rect x="1228" y="110" width="268" height="250" rx="12" fill="#ede9fe" opacity="0.5"/>
<circle cx="1362.0" cy="144" r="21" fill="#7c3aed"/>
<text x="1362.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="1362.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Switch languages</text>
<text x="1362.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">Speak Telugu mid-call —</text>
<text x="1362.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">it notices, confirms,</text>
<text x="1362.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">then continues in Telugu</text>
</svg>