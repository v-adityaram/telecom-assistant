<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 430" font-family="Segoe UI, Arial, sans-serif">
<rect x="0" y="0" width="1560" height="430" fill="#ffffff"/>
<defs><marker id="hd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/></marker></defs>
<text x="780.0" y="34" font-size="21" font-weight="800" fill="#0f172a" text-anchor="middle">Chat: a question that needs more than one lookup</text>
<text x="780.0" y="56" font-size="13" fill="#64748b" text-anchor="middle" font-style="italic">Real example — "Am I eligible for 5G?"</text>
<line x1="330" y1="235.0" x2="350" y2="235.0" stroke="#c2410c" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="60" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
<rect x="60" y="110" width="268" height="250" rx="12" fill="#ffedd5" opacity="0.5"/>
<circle cx="194.0" cy="144" r="21" fill="#c2410c"/>
<text x="194.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">1</text>
<text x="194.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">You ask</text>
<text x="194.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">You type:</text>
<text x="194.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">"Am I eligible</text>
<text x="194.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">for 5G?"</text>
<line x1="622" y1="235.0" x2="642" y2="235.0" stroke="#c2410c" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="352" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
<rect x="352" y="110" width="268" height="250" rx="12" fill="#ffedd5" opacity="0.5"/>
<circle cx="486.0" cy="144" r="21" fill="#c2410c"/>
<text x="486.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
<text x="486.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">AI spots the catch</text>
<text x="486.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">One simple lookup</text>
<text x="486.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">won't fully answer</text>
<text x="486.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">this question</text>
<line x1="914" y1="235.0" x2="934" y2="235.0" stroke="#c2410c" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="644" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
<rect x="644" y="110" width="268" height="250" rx="12" fill="#ffedd5" opacity="0.5"/>
<circle cx="778.0" cy="144" r="21" fill="#c2410c"/>
<text x="778.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">3</text>
<text x="778.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Two lookups, at once</text>
<text x="778.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">Checks your PLAN and</text>
<text x="778.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">your PHONE at the</text>
<text x="778.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">same time — not</text>
<text x="778.0" y="264" font-size="11.8" fill="#334155" text-anchor="middle">one after another</text>
<line x1="1206" y1="235.0" x2="1226" y2="235.0" stroke="#c2410c" stroke-width="2.5" marker-end="url(#hd)"/>
<rect x="936" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
<rect x="936" y="110" width="268" height="250" rx="12" fill="#ffedd5" opacity="0.5"/>
<circle cx="1070.0" cy="144" r="21" fill="#c2410c"/>
<text x="1070.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">4</text>
<text x="1070.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">Combines the results</text>
<text x="1070.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">Puts both real</text>
<text x="1070.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">answers together</text>
<text x="1070.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">into one explanation</text>
<rect x="1228" y="110" width="268" height="250" rx="12" fill="#ffffff" stroke="#c2410c" stroke-width="1.8"/>
<rect x="1228" y="110" width="268" height="250" rx="12" fill="#ffedd5" opacity="0.5"/>
<circle cx="1362.0" cy="144" r="21" fill="#c2410c"/>
<text x="1362.0" y="151" font-size="19" font-weight="800" fill="#ffffff" text-anchor="middle">5</text>
<text x="1362.0" y="186" font-size="15" font-weight="700" fill="#0f172a" text-anchor="middle">You see it</text>
<text x="1362.0" y="210" font-size="11.8" fill="#334155" text-anchor="middle">"Yes — you're eligible,</text>
<text x="1362.0" y="228" font-size="11.8" fill="#334155" text-anchor="middle">and your phone</text>
<text x="1362.0" y="246" font-size="11.8" fill="#334155" text-anchor="middle">supports it too."</text>
</svg>