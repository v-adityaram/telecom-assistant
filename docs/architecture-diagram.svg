<line x1="415" y1="554" x2="602" y2="584" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="360" y1="700" x2="460" y2="730" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="602" y1="700" x2="700" y2="730" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
<line x1="775" y1="224" x2="1000" y2="308" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<line x1="950" y1="424" x2="950" y2="454" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<rect x="966" y="428" width="123.89999999999999" height="16" fill="#ffffff" opacity="0.92"/>
<text x="970" y="440" font-size="10.5" fill="#7c3aed" font-style="italic">session mint (once)</text>
<line x1="1280" y1="424" x2="1220" y2="730" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
<rect x="1286" y="548" width="130.0" height="16" fill="#ffffff" opacity="0.92"/>
<text x="1290" y="560" font-size="10.5" fill="#7c3aed" font-style="italic">tool call (per turn)</text>
<line x1="765" y1="785" x2="765" y2="800" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<line x1="765" y1="844" x2="765" y2="858" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
<line x1="415" y1="902" x2="415" y2="968" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
<rect x="421" y="926" width="62.9" height="16" fill="#ffffff" opacity="0.92"/>
<text x="425" y="938" font-size="10.5" fill="#6b7280" font-style="italic">HTTPS GET</text>
<path d="M 730,529 L 760,529 L 760,1003 L 818,1003" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
<text x="770" y="760" font-size="10" fill="#6b7280" font-style="italic" text-anchor="middle" transform="rotate(-90 770 760)">Chat Completions API (Agents 1–4)</text>
<path d="M 1115,544 L 1500,544 L 1500,1059 L 1412,1059" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-gray)"/>
<text x="1512" y="800" font-size="10" fill="#6b7280" font-style="italic" text-anchor="middle" transform="rotate(-90 1512 800)">POST /realtime/client_secrets (mint)</text>
<path d="M 950,128 L 950,102 L 1560,102 L 1560,1059 L 1412,1059" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)"/>
<rect x="986" y="85" width="422.79999999999995" height="16" fill="#ffffff" opacity="0.92"/>
<text x="990" y="97" font-size="10.5" fill="#7c3aed" font-style="italic">direct WebRTC — audio &amp; function-call events never touch our backend</text>
</svg>