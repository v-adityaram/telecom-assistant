# Telecom AI Assistant — nginx site (installed by deploy/setup_vm.sh).
#
# HTTPS is required, not cosmetic: browsers only grant microphone access
# (getUserMedia) in a secure context, so over plain http on a non-localhost
# origin the voice feature is dead while chat still works. With no domain
# name for this VM the cert is self-signed (one browser warning to click
# through). To upgrade later: point a domain here, `certbot --nginx`, done.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/ssl/certs/telecom-assistant.crt;
    ssl_certificate_key /etc/ssl/private/telecom-assistant.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Audio never passes through here — WebRTC goes browser -> Azure directly.
    # This only proxies the JSON API and the static page.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # COMPLEX (LangGraph) turns take ~10s; leave headroom.
        proxy_read_timeout 60s;
    }
}
