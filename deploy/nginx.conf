# Telecom AI Assistant — nginx site (installed by deploy/setup_vm.sh).
#
# HTTPS is required, not cosmetic: browsers only grant microphone access
# (getUserMedia) in a secure context, so over plain http on a non-localhost
# origin the voice feature is dead while chat still works. Served under
# __PUBLIC_DOMAIN__ (a sslip.io hostname that resolves to this VM's IP with
# no DNS setup needed) with a real Let's Encrypt certificate — setup_vm.sh
# substitutes __PUBLIC_DOMAIN__ below and obtains the certificate before
# this file is installed.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Let's Encrypt's HTTP-01 challenge, both for the first certificate and
    # every automatic renewal — must stay reachable over plain http, so this
    # comes before the redirect below.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name __PUBLIC_DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__PUBLIC_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PUBLIC_DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Audio never passes through here — WebRTC goes browser -> Azure directly.
    # This only proxies the JSON API and the static page.
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # COMPLEX (LangGraph) turns take ~10s; leave headroom.
        proxy_read_timeout 60s;
    }
}
